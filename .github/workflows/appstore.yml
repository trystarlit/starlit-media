# Builds starlit on a GitHub Mac and uploads it to App Store Connect (no Mac of our own needed).
# Run it: GitHub → Actions → "App Store build" → Run workflow.
# Secrets (repo Settings → Secrets and variables → Actions), from App Store Connect → Users and Access → Integrations:
#   ASCKEYID        the key's Key ID
#   ASCISSUERID   the Issuer ID above the keys table
#   ASCKEYP8        the whole text of the downloaded AuthKey_XXXX.p8 file
name: App Store build

on:
  workflow_dispatch:
    inputs:
      build:
        description: Build number (must be higher than any upload so far)
        required: true
        default: "2"

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode on the runner
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASCKEYP8 }}
          ASC_KEY_ID: ${{ secrets.ASCKEYID }}
          ASC_ISSUER_ID: ${{ secrets.ASCISSUERID }}
        run: |
          missing=""
          [ -z "$ASC_KEY_ID" ] && missing="$missing ASC_KEY_ID"
          [ -z "$ASC_ISSUER_ID" ] && missing="$missing ASC_ISSUER_ID"
          [ -z "$ASC_KEY_P8" ] && missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing"; exit 1; fi
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey.p8"

      - name: Archive
        working-directory: ios
        run: |
          xcodebuild -project Starlit.xcodeproj -scheme Starlit -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Starlit.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASCKEYID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASCISSUERID }}" \
            CURRENT_PROJECT_VERSION="${{ inputs.build }}" \
            archive

      # Export locally first and check the App Store signature: the app and the 3 Screen Time extensions must carry
      # com.apple.developer.family-controls, and the widget must not link the Screen Time frameworks (Guideline 2.5.1).
      - name: Check Family Controls entitlements
        working-directory: ios
        run: |
          cp ExportOptions.plist "$RUNNER_TEMP/ExportLocal.plist"
          plutil -replace destination -string export "$RUNNER_TEMP/ExportLocal.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Starlit.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportLocal.plist" -exportPath "$RUNNER_TEMP/local" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASCKEYID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASCISSUERID }}"
          cd "$RUNNER_TEMP/local" && unzip -q *.ipa
          fail=0
          for b in Payload/Starlit.app Payload/Starlit.app/PlugIns/*.appex; do
            name=$(basename "$b")
            ents=$(codesign -d --entitlements - --xml "$b" 2>/dev/null | plutil -convert xml1 -o - - 2>/dev/null)
            fc=$(echo "$ents" | grep -c "com.apple.developer.family-controls" || true)
            exe="$b/$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$b/Info.plist")"
            links=$(otool -L "$exe" | grep -cE "FamilyControls|ManagedSettings|DeviceActivity" || true)
            echo "$name: family-controls entitlement=$fc, links Screen Time frameworks=$links"
            if [ "$links" -gt 0 ] && [ "$fc" -eq 0 ]; then echo "::error::$name links Screen Time but has no family-controls entitlement"; fail=1; fi
            case "$name" in Starlit.app|StarlitMonitor.appex|StarlitShield.appex|StarlitShieldAction.appex)
              if [ "$fc" -eq 0 ]; then echo "::error::$name is missing com.apple.developer.family-controls"; fail=1; fi ;;
            esac
          done
          exit $fail

      - name: Upload to App Store Connect
        working-directory: ios
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Starlit.xcarchive" \
            -exportOptionsPlist ExportOptions.plist -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASCKEYID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASCISSUERID }}"

      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
